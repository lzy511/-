<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜数字小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 {
    text-align: center;
    font-size: 24px;
    color: #333;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .status {
    text-align: center;
    font-size: 15px;
    color: #555;
    background: #f5f6fa;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .hint {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    min-height: 28px;
    margin-bottom: 16px;
  }
  .hint.high { color: #e74c3c; }
  .hint.low  { color: #2980b9; }
  .hint.win  { color: #27ae60; }
  .hint.lose { color: #e67e22; }
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  input {
    flex: 1;
    padding: 12px 14px;
    font-size: 18px;
    border: 2px solid #ddd;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #667eea; }
  input:disabled { background: #f0f0f0; }
  button {
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  #guessBtn { background: #667eea; }
  #resetBtn { background: #95a5a6; width: 100%; }
  .history-title {
    font-size: 14px;
    color: #888;
    margin-bottom: 8px;
  }
  .history {
    list-style: none;
    max-height: 160px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history li {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    background: #f8f9fb;
    border-radius: 8px;
    font-size: 14px;
    color: #444;
  }
  .history .tag-high { color: #e74c3c; font-weight: bold; }
  .history .tag-low  { color: #2980b9; font-weight: bold; }
  .history .tag-hit  { color: #27ae60; font-weight: bold; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎯 猜数字</h1>
    <p class="subtitle">我心里藏了一个 1 ~ 100 的数，你有 6 次机会</p>

    <div class="status" id="status">剩余次数：<b id="left">6</b> / 6</div>
    <div class="hint" id="hint"></div>

    <div class="input-row">
      <input type="number" id="guessInput" min="1" max="100" placeholder="输入 1~100 的整数">
      <button id="guessBtn">猜！</button>
    </div>

    <button id="resetBtn">重置游戏</button>

    <p class="history-title" style="margin-top:20px;">📜 猜测记录</p>
    <ul class="history" id="history"></ul>
  </div>

<script>
  var answer = Math.floor(Math.random() * 100) + 1;
  var left = 6;
  var gameOver = false;

  var input = document.getElementById('guessInput');
  var guessBtn = document.getElementById('guessBtn');
  var resetBtn = document.getElementById('resetBtn');
  var leftEl = document.getElementById('left');
  var hintEl = document.getElementById('hint');
  var statusEl = document.getElementById('status');
  var historyEl = document.getElementById('history');

  function setHint(text, cls) {
    hintEl.textContent = text;
    hintEl.className = 'hint ' + (cls || '');
  }

  function addHistory(n, tag, cls) {
    var li = document.createElement('li');
    li.innerHTML = '<span>第 ' + (6 - left) + ' 次：' + n + '</span><span class="' + cls + '">' + tag + '</span>';
    historyEl.appendChild(li);
  }

  function guess() {
    if (gameOver) return;

    var raw = input.value.trim();
    var n = Number(raw);

    // 输入校验
    if (raw === '' || !Number.isInteger(n)) {
      setHint('请输入一个整数哦', 'high');
      return;
    }
    if (n < 1 || n > 100) {
      setHint('范围是 1 ~ 100，超出啦', 'high');
      return;
    }

    left--;
    leftEl.textContent = left;

    if (n === answer) {
      setHint('🎉 猜对了！答案就是 ' + answer, 'win');
      addHistory(n, '✔ 猜中', 'tag-hit');
      endGame();
    } else if (n > answer) {
      setHint(n + ' 偏大了，往小猜', 'high');
      addHistory(n, '↑ 偏大', 'tag-high');
    } else {
      setHint(n + ' 偏小了，往大猜', 'low');
      addHistory(n, '↓ 偏小', 'tag-low');
    }

    if (left <= 0 && !gameOver) {
      setHint('😅 次数用完了，答案是 ' + answer, 'lose');
      endGame();
    }

    input.value = '';
    input.focus();
  }

  function endGame() {
    gameOver = true;
    input.disabled = true;
    guessBtn.disabled = true;
    statusEl.innerHTML = '游戏结束，点下面的按钮重新开始';
  }

  function reset() {
    answer = Math.floor(Math.random() * 100) + 1;
    left = 6;
    gameOver = false;
    leftEl.textContent = left;
    statusEl.innerHTML = '剩余次数：<b id="left">6</b> / 6';
    // 重新绑定更新后的元素
    leftEl = document.getElementById('left');
    setHint('', '');
    historyEl.innerHTML = '';
    input.disabled = false;
    guessBtn.disabled = false;
    input.value = '';
    input.focus();
  }

  guessBtn.addEventListener('click', guess);
  resetBtn.addEventListener('click', reset);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') guess();
  });
</script>
</body>
</html>
